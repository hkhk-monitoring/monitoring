  <marker id="h1o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8f00"/></marker></defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Prometheuse ülesehitus</text>
  <text x="110" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#546e7a">TARGET'ID</text>
  <rect x="20" y="75" width="180" height="56" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/><text x="110" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#004d40">node_exporter</text><text x="110" y="118" text-anchor="middle" font-size="11" fill="#263238">masina näidud :9100</text>
  <rect x="20" y="145" width="180" height="56" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/><text x="110" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#004d40">rakendus</text><text x="110" y="188" text-anchor="middle" font-size="11" fill="#263238">oma /metrics</text>
  <rect x="20" y="215" width="180" height="56" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="5 4"/><text x="110" y="240" text-anchor="middle" font-size="13" fill="#546e7a">teised exporter'id</text><text x="110" y="258" text-anchor="middle" font-size="11" fill="#546e7a">andmebaas, Blackbox (N11)</text>
  <rect x="290" y="65" width="320" height="230" rx="12" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">Prometheuse server</text>
