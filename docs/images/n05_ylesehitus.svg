  <rect x="310" y="163" width="280" height="44" rx="6" fill="#ffffff" stroke="#ff8f00"/><text x="450" y="190" text-anchor="middle" font-size="13" fill="#5d4037"><tspan font-weight="700">aegridade andmebaas</tspan> (TSDB)</text>
  <rect x="310" y="221" width="280" height="44" rx="6" fill="#ffffff" stroke="#ff8f00"/><text x="450" y="248" text-anchor="middle" font-size="13" fill="#5d4037"><tspan font-weight="700">PromQL</tspan> ja alarmireeglid</text>
  <g stroke="#ff8f00" stroke-width="1.5"><line x1="450" y1="149" x2="450" y2="161" marker-end="url(#h1o)"/><line x1="450" y1="207" x2="450" y2="219" marker-end="url(#h1o)"/></g>
  <g stroke="#ff8f00" stroke-width="2.5"><line x1="308" y1="122" x2="204" y2="103" marker-end="url(#h1o)"/><line x1="308" y1="127" x2="204" y2="173" marker-end="url(#h1o)"/><line x1="308" y1="132" x2="204" y2="240" marker-end="url(#h1o)" stroke-dasharray="5 4"/></g>
  <text x="255" y="300" text-anchor="middle" font-size="11" fill="#e65100">GET /metrics</text>
  <text x="790" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#546e7a">KASUTAB ANDMEID</text>
  <rect x="700" y="75" width="180" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="790" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">veebiliides</text><text x="790" y="118" text-anchor="middle" font-size="11" fill="#263238">Query, Target health (N5)</text>
  <rect x="700" y="145" width="180" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="790" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">Grafana</text><text x="790" y="188" text-anchor="middle" font-size="11" fill="#263238">töölaud (N6)</text>
