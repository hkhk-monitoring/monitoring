  <text x="450" y="335" text-anchor="middle" font-size="12" fill="#263238">Prometheus küsib target'itelt mõõdikud, salvestab need aegridadena ja vastab PromQL-i päringutele.</text>
  <text x="450" y="355" text-anchor="middle" font-size="12" fill="#263238">Täna kasutad veebiliidest, N6-s lisanduvad Grafana ja Alertmanager.</text>
  <text x="450" y="385" text-anchor="middle" font-size="11" fill="#546e7a">Kriipsjoonega osad on selle kursuse hilisemates nädalates.</text>
</svg>
