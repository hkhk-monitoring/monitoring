<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="e1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/></marker></defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Neli kuldset signaali: teenus kasutaja vaatest</text>
  <rect x="30" y="150" width="140" height="70" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="100" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">kasutaja</text>
  <text x="100" y="202" text-anchor="middle" font-size="11" fill="#37474f">päringud</text>
  <line x1="170" y1="185" x2="326" y2="185" stroke="#546e7a" stroke-width="2.5" marker-end="url(#e1)"/>
  <rect x="330" y="130" width="200" height="110" rx="12" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="430" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#004d40">e-pood</text>
  <text x="430" y="198" text-anchor="middle" font-size="12" fill="#263238">veebiserver + andmebaas</text>
  <g font-size="13">
    <rect x="590" y="55" width="290" height="62" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="605" y="80" font-weight="700" fill="#e65100">Latentsus (latency)</text>
    <text x="605" y="102" font-size="12" fill="#263238">kui kaua vastus võtab: 95% alla 300 ms</text>
    <rect x="590" y="125" width="290" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="605" y="150" font-weight="700" fill="#0d47a1">Liiklus (traffic)</text>
    <text x="605" y="172" font-size="12" fill="#263238">kui palju nõudlust: 40 päringut sekundis</text>
    <rect x="590" y="195" width="290" height="62" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="605" y="220" font-weight="700" fill="#c62828">Vead (errors)</text>
    <text x="605" y="242" font-size="12" fill="#263238">mitu päringut ebaõnnestub: 0,3% annab 500</text>
    <rect x="590" y="265" width="290" height="62" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="605" y="290" font-weight="700" fill="#004d40">Küllastus (saturation)</text>
    <text x="605" y="312" font-size="12" fill="#263238">kui täis teenus on: USE-st tuttav</text>
  </g>
  <g stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4 4"><line x1="530" y1="160" x2="588" y2="86"/><line x1="530" y1="175" x2="588" y2="156"/><line x1="530" y1="195" x2="588" y2="226"/><line x1="530" y1="210" x2="588" y2="296"/></g>
  <text x="430" y="300" text-anchor="middle" font-size="12" fill="#546e7a">USE vaatab masinat, kuldsed signaalid teenust.</text>
  <text x="430" y="320" text-anchor="middle" font-size="11" fill="#546e7a">Näiteväärtused on illustratiivsed.</text>
</svg>
