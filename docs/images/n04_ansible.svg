<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="d4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/></marker></defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Üks playbook, erinev ainult masina nimi</text>
  <rect x="20" y="60" width="340" height="230" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="40" y="86" font-size="14" font-weight="700" fill="#37474f">konf/agent.yml</text>
  <g font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">
    <text x="40" y="114">võti, hoidla, pakett</text>
    <text x="40" y="136">Server=<tspan fill="#e65100">{{ zabbix_server }}</tspan></text>
    <text x="40" y="158">ServerActive=<tspan fill="#e65100">{{ zabbix_server }}</tspan></text>
    <text x="40" y="180">Hostname=<tspan fill="#1565c0" font-weight="700">{{ inventory_hostname }}</tspan></text>
    <text x="40" y="202">port 10050/tcp</text>
    <text x="40" y="224">teenus käivitatud</text>
    <text x="40" y="254" fill="#546e7a">-i proxmox2,proxmox3,</text>
  </g>
  <rect x="560" y="60" width="320" height="95" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="720" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">proxmox2</text>
  <text x="720" y="114" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">Hostname=<tspan fill="#1565c0" font-weight="700">proxmox2</tspan></text>
  <text x="720" y="138" text-anchor="middle" font-size="12" fill="#263238">kõik muu sama</text>
