  <text x="720" y="213" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">proxmox3</text>
  <text x="720" y="239" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">Hostname=<tspan fill="#1565c0" font-weight="700">proxmox3</tspan></text>
  <text x="720" y="263" text-anchor="middle" font-size="12" fill="#263238">kõik muu sama</text>
