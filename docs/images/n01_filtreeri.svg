<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#004d40">Filtreeri, loenda, vaata</text>
  <polygon points="60,55 840,55 700,125 200,125" fill="#e0f2f1" stroke="#00796b"/>
  <text x="450" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#004d40">1. Filtreeri: 2 000 000 rida → 41 300</text>
  <text x="450" y="107" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">grep 'staatus=500' veeb.log</text>
  <polygon points="200,135 700,135 600,195 300,195" fill="#fff8e1" stroke="#ff8f00"/>
  <text x="450" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">2. Loenda: kellelt? mis minutil?</text>
  <text x="450" y="182" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">... | sort | uniq -c | sort -rn | head</text>
  <rect x="330" y="205" width="240" height="40" rx="6" fill="#00796b"/>
  <text x="450" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Vaata: loe 3-5 rida</text>
</svg>
