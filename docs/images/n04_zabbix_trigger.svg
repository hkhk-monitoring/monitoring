<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">Kust leiad trigger'i loomise (Zabbix 7.0 veebiliides, skeem)</text>
  <text x="20" y="62" font-size="12" fill="#263238"><tspan font-weight="700" fill="#c62828">1</tspan> Data collection → Hosts</text>
  <text x="250" y="62" font-size="12" fill="#263238"><tspan font-weight="700" fill="#c62828">2</tspan> rea proxmox2 juures link <tspan font-weight="700">Triggers</tspan></text>
  <text x="560" y="62" font-size="12" fill="#263238"><tspan font-weight="700" fill="#c62828">3</tspan> üleval paremal <tspan font-weight="700">Create trigger</tspan></text>
  <rect x="20" y="80" width="680" height="28" fill="#eceff1"/>
  <g font-size="11" font-weight="700" fill="#37474f"><text x="30" y="98">Name</text><text x="150" y="98">Items</text><text x="220" y="98">Triggers</text><text x="300" y="98">Graphs</text></g>
  <rect x="20" y="108" width="680" height="28" fill="#ffffff" stroke="#eceff1"/>
  <g font-size="12"><text x="30" y="127" fill="#1565c0">proxmox2</text><text x="150" y="127" fill="#1565c0">Items 73</text><rect x="214" y="113" width="74" height="20" rx="3" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="220" y="127" fill="#1565c0">Triggers 30</text></g>
  <rect x="740" y="80" width="140" height="28" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="810" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">Create trigger</text>
  <rect x="20" y="150" width="860" height="240" rx="6" fill="#fafafa" stroke="#b0bec5"/>
  <text x="35" y="174" font-size="13" font-weight="700" fill="#263238">Trigger (vorm)</text>
  <g font-size="12">
    <text x="160" y="206" text-anchor="end" fill="#37474f">* Name</text><rect x="170" y="192" width="300" height="22" fill="#fff" stroke="#b0bec5"/><text x="178" y="208" fill="#263238">Vaba kettaruum alla 20%</text>
    <text x="160" y="240" text-anchor="end" fill="#37474f">Severity</text>
    <g font-size="11"><rect x="170" y="226" width="86" height="22" fill="#fff" stroke="#b0bec5"/><text x="213" y="241" text-anchor="middle" fill="#546e7a">Not classified</text><rect x="256" y="226" width="76" height="22" fill="#fff" stroke="#b0bec5"/><text x="294" y="241" text-anchor="middle" fill="#546e7a">Information</text><rect x="332" y="226" width="64" height="22" fill="#fff3cd" stroke="#c62828" stroke-width="2"/><text x="364" y="241" text-anchor="middle" fill="#263238" font-weight="700">Warning</text><rect x="396" y="226" width="64" height="22" fill="#fff" stroke="#b0bec5"/><text x="428" y="241" text-anchor="middle" fill="#546e7a">Average</text><rect x="460" y="226" width="50" height="22" fill="#fff" stroke="#b0bec5"/><text x="485" y="241" text-anchor="middle" fill="#546e7a">High</text><rect x="510" y="226" width="64" height="22" fill="#fff" stroke="#b0bec5"/><text x="542" y="241" text-anchor="middle" fill="#546e7a">Disaster</text></g>
    <text x="160" y="276" text-anchor="end" fill="#37474f">* Expression</text><rect x="170" y="262" width="420" height="44" fill="#fff" stroke="#b0bec5"/><text x="178" y="288" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">last(/proxmox2/vfs.fs.size[/,pfree])&lt;20</text>
    <rect x="600" y="262" width="54" height="22" rx="3" fill="#eceff1" stroke="#b0bec5"/><text x="627" y="277" text-anchor="middle" fill="#37474f">Add</text>
    <text x="664" y="277" fill="#546e7a" font-size="11">avaldise koostaja: item, funktsioon,</text>
    <text x="664" y="292" fill="#546e7a" font-size="11">tingimus ja väärtus</text>
    <text x="160" y="330" text-anchor="end" fill="#37474f">OK event generation</text><text x="170" y="330" fill="#263238">Expression (vaikimisi, jäta nii)</text>
    <rect x="170" y="352" width="60" height="22" rx="3" fill="#1565c0"/><text x="200" y="367" text-anchor="middle" fill="#fff" font-weight="700">Add</text>
  </g>
  <text x="450" y="415" text-anchor="middle" font-size="11" fill="#546e7a">Skeem, mitte ekraanipilt. Item peab olemas olema enne trigger'it, muidu avaldis ei leia võtit.</text>
</svg>
