<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="z2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8f00"/></marker></defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Host, template, item, trigger</text>
  <rect x="20" y="55" width="240" height="225" rx="12" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#004d40">Host</text>
  <text x="140" y="108" text-anchor="middle" font-size="13" fill="#263238">proxmox2</text>
  <text x="140" y="128" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#546e7a">IP 192.168.x.x</text>
  <text x="140" y="165" text-anchor="middle" font-size="12" fill="#263238">masin, mida jälgid</text>
  <text x="140" y="250" text-anchor="middle" font-size="12" fill="#00796b">template on hostil külge pandud</text>
  <line x1="260" y1="165" x2="316" y2="165" stroke="#ff8f00" stroke-width="2.5" marker-end="url(#z2)"/>
  <rect x="320" y="55" width="560" height="225" rx="12" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="600" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">Template „ICMP Ping“</text>
  <text x="600" y="106" text-anchor="middle" font-size="12" fill="#5d4037">valmis komplekt: muudad ühe korra, kehtib kõigil hostidel</text>
  <rect x="340" y="122" width="250" height="140" rx="8" fill="#ffffff" stroke="#90a4ae"/>
  <text x="465" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Item'id: mida küsida</text>
  <g font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">
    <text x="355" y="174">icmpping      1 / 0</text>
    <text x="355" y="198">icmppingsec   0.0004 s</text>
    <text x="355" y="222">icmppingloss  0 %</text>
  </g>
  <text x="465" y="250" text-anchor="middle" font-size="11" fill="#546e7a">iga minut, iga number kellaajaga</text>
  <line x1="590" y1="190" x2="616" y2="190" stroke="#ff8f00" stroke-width="2.5" marker-end="url(#z2)"/>
  <rect x="620" y="122" width="245" height="140" rx="8" fill="#ffffff" stroke="#c62828"/>
  <text x="742" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">Trigger: millal häire</text>
  <text x="742" y="176" text-anchor="middle" font-size="12" fill="#263238">3 viimast icmpping = 0</text>
  <text x="742" y="200" text-anchor="middle" font-size="12" fill="#263238">→ probleem</text>
  <text x="742" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#c62828">Unavailable by ICMP ping</text>
</svg>
