<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Mõõdiku nimi, sildid ja väärtus</text>
  <rect x="40" y="55" width="820" height="50" rx="8" fill="#f5f5f5" stroke="#b0bec5"/>
  <text x="60" y="87" font-size="19" font-family="JetBrains Mono, Menlo, monospace"><tspan fill="#e65100" font-weight="700">node_cpu_seconds_total</tspan><tspan fill="#00796b">{cpu="0",mode="idle"}</tspan><tspan fill="#1565c0" font-weight="700"> 12345.6</tspan></text>
  <path d="M60,115 v10 h250 v-10" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="185" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">mõõdiku nimi</text>
  <text x="185" y="163" text-anchor="middle" font-size="12" fill="#5d4037">mida mõõdetakse</text>
  <path d="M318,115 v10 h232 v-10" fill="none" stroke="#00796b" stroke-width="2"/>
  <text x="434" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#00796b">sildid</text>
  <text x="434" y="163" text-anchor="middle" font-size="12" fill="#263238">milline protsessor, milline olek</text>
  <path d="M562,115 v10 h86 v-10" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="605" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">väärtus</text>
  <text x="605" y="163" text-anchor="middle" font-size="12" fill="#263238">sekundit</text>
  <text x="40" y="205" font-size="13" font-weight="700" fill="#263238">Sama nimi, eri sildid = eri aegread:</text>
  <text x="60" y="230" font-size="14" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">node_cpu_seconds_total<tspan fill="#00796b">{cpu="0",mode="idle"}</tspan></text>
  <text x="60" y="252" font-size="14" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">node_cpu_seconds_total<tspan fill="#00796b">{cpu="1",mode="idle"}</tspan></text>
  <text x="60" y="274" font-size="14" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">node_cpu_seconds_total<tspan fill="#00796b">{cpu="0",mode="user"}</tspan></text>
  <rect x="560" y="200" width="300" height="90" rx="8" fill="#fff8e1" stroke="#ff8f00"/>
  <text x="575" y="222" font-size="12" font-weight="700" fill="#e65100">Prometheus lisab kogumisel</text>
  <text x="575" y="244" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#5d4037">job="node"</text>
  <text x="575" y="264" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#5d4037">instance="192.168.35.12:9100"</text>
  <text x="575" y="282" font-size="11" fill="#5d4037">nende järgi valid masina</text>
