<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="h5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/></marker></defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Võrdlus filtreerib read</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">vaba ruumi protsent <tspan fill="#c62828" font-weight="700">&lt; 20</tspan></text>
  <g font-size="13" font-family="JetBrains Mono, Menlo, monospace">
    <rect x="80" y="85" width="260" height="36" fill="#fafafa" stroke="#b0bec5"/><text x="95" y="108">proxmox2</text><text x="195" y="108">/</text><text x="295" y="108">71</text>
    <rect x="80" y="127" width="260" height="36" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="95" y="150">proxmox3</text><text x="195" y="150">/</text><text x="295" y="150">15</text>
    <rect x="80" y="169" width="260" height="36" fill="#fafafa" stroke="#b0bec5"/><text x="95" y="192">proxmox3</text><text x="195" y="192">/boot</text><text x="295" y="192">64</text>
    <rect x="560" y="127" width="260" height="36" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="575" y="150">proxmox3</text><text x="675" y="150">/</text><text x="775" y="150">15</text>
  </g>
  <line x1="345" y1="145" x2="555" y2="145" stroke="#546e7a" stroke-width="2.5" marker-end="url(#h5)"/>
  <text x="450" y="135" text-anchor="middle" font-size="12" fill="#546e7a">alles jääb ainult see rida</text>
  <text x="450" y="245" text-anchor="middle" font-size="12" fill="#263238">Tühi tulemus tähendab, et ühelgi masinal tingimus ei kehti.</text>
  <text x="450" y="265" text-anchor="middle" font-size="12" fill="#263238">N6-s saab sellisest päringust alarmireegel: rida tulemuses = probleem.</text>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#546e7a">Väärtused on illustratiivsed.</text>
</svg>
