<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">SLI, SLO ja SLA ühel skaalal</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#546e7a">õnnestunud päringute osakaal 30 päeva jooksul</text>
  <rect x="80" y="140" width="280" height="40" fill="#ffebee"/>
  <rect x="360" y="140" width="280" height="40" fill="#fff8e1"/>
  <rect x="640" y="140" width="180" height="40" fill="#e0f2f1"/>
  <line x1="80" y1="180" x2="820" y2="180" stroke="#37474f" stroke-width="2"/>
  <g font-size="12" fill="#37474f" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">
    <line x1="80" y1="180" x2="80" y2="188" stroke="#37474f"/><text x="80" y="204">98%</text>
    <line x1="360" y1="180" x2="360" y2="188" stroke="#37474f"/><text x="360" y="204">99%</text>
    <line x1="820" y1="180" x2="820" y2="188" stroke="#37474f"/><text x="820" y="204">100%</text>
  </g>
  <line x1="360" y1="102" x2="360" y2="180" stroke="#c62828" stroke-width="3"/>
  <text x="360" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">SLA 99,0%</text>
  <text x="360" y="94" text-anchor="middle" font-size="11" fill="#c62828">kokkulepe kliendiga</text>
  <line x1="640" y1="102" x2="640" y2="180" stroke="#e65100" stroke-width="3"/>
  <text x="640" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">SLO 99,5%</text>
  <text x="640" y="94" text-anchor="middle" font-size="11" fill="#e65100">meeskonna eesmärk</text>
  <line x1="764" y1="120" x2="764" y2="180" stroke="#00796b" stroke-width="3"/>
  <circle cx="764" cy="120" r="6" fill="#00796b"/>
  <text x="764" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#00796b">SLI 99,7%</text>
  <path d="M640,230 v10 h180 v-10" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="730" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">veaeelarve 0,5%</text>
  <text x="730" y="280" text-anchor="middle" font-size="11" fill="#5d4037">kuni 500 ebaõnnestunud päringut 100 000-st</text>
  <text x="300" y="262" text-anchor="middle" font-size="12" fill="#263238">SLI on mõõdetud, SLO on eesmärk, SLA on kokkulepe.</text>
  <text x="300" y="282" text-anchor="middle" font-size="12" fill="#263238">SLO on rangem kui SLA, et jääks reageerimisvaru.</text>
  <text x="220" y="165" text-anchor="middle" font-size="11" fill="#c62828">SLA rikutud</text>
  <text x="500" y="165" text-anchor="middle" font-size="11" fill="#e65100">SLO rikutud</text>
  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#546e7a">Näiteväärtused on illustratiivsed. Skaala ei ole lineaarne.</text>
</svg>
