<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="b5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/></marker></defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Kuidas tekib protsessori kasutuse päring</text>
  <text x="40" y="62" font-size="12" font-weight="700" fill="#546e7a">PÄRING</text>
  <text x="560" y="62" font-size="12" font-weight="700" fill="#546e7a">TULEMUS proxmox2 kohta (2 protsessorit)</text>
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="13">
    <rect x="30" y="75" width="510" height="70" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="45" y="105" fill="#e65100">node_cpu_seconds_total{mode="idle"}</text>
    <rect x="555" y="75" width="315" height="70" rx="8" fill="#fafafa" stroke="#b0bec5"/>
    <text x="570" y="102" fill="#263238">cpu="0"  48210.5</text>
    <text x="570" y="124" fill="#263238">cpu="1"  48307.9</text>

    <rect x="30" y="170" width="510" height="70" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="45" y="200" fill="#263238"><tspan fill="#00796b" font-weight="700">rate(</tspan>node_cpu_seconds_total{mode="idle"}<tspan fill="#00796b" font-weight="700">[1m])</tspan></text>
    <rect x="555" y="170" width="315" height="70" rx="8" fill="#fafafa" stroke="#b0bec5"/>
    <text x="570" y="197" fill="#263238">cpu="0"  0.97</text>
    <text x="570" y="219" fill="#263238">cpu="1"  0.95</text>

    <rect x="30" y="265" width="510" height="70" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="45" y="295" fill="#263238"><tspan fill="#1565c0" font-weight="700">avg by (instance) (</tspan>rate(…[1m])<tspan fill="#1565c0" font-weight="700">)</tspan></text>
    <rect x="555" y="265" width="315" height="70" rx="8" fill="#fafafa" stroke="#b0bec5"/>
    <text x="570" y="305" fill="#263238">0.96</text>

    <rect x="30" y="360" width="510" height="70" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="45" y="390" fill="#263238"><tspan fill="#004d40" font-weight="700">100 * (1 - </tspan>avg by (instance) (…)<tspan fill="#004d40" font-weight="700">)</tspan></text>
    <rect x="555" y="360" width="315" height="70" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="570" y="400" fill="#004d40" font-weight="700">4 %</text>
  </g>
  <g font-size="12" fill="#546e7a">
    <text x="45" y="134">counter: jõudeoleku sekundid alates käivitusest, ainult kasvab</text>
    <text x="45" y="229">kasv sekundis: mitu sekundit sekundist protsessor puhkas (0–1)</text>
    <text x="45" y="324">keskmine üle protsessorite: üks rida iga masina kohta</text>
    <text x="45" y="419">töös oldud aja osa protsentides</text>
  </g>
  <g stroke="#546e7a" stroke-width="2"><line x1="285" y1="145" x2="285" y2="166" marker-end="url(#b5)"/><line x1="285" y1="240" x2="285" y2="261" marker-end="url(#b5)"/><line x1="285" y1="335" x2="285" y2="356" marker-end="url(#b5)"/></g>
  <text x="450" y="458" text-anchor="middle" font-size="12" fill="#546e7a">Illustratiivsed väärtused.</text>
