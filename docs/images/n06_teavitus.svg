<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="t6a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/></marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Kuidas Alertmanager tõendab, et tal on õigus teadet saata</text>

  <rect x="320" y="48" width="260" height="46" rx="10" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="450" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Alertmanager</text>
  <text x="450" y="86" text-anchor="middle" font-size="11" fill="#5d4037">saadab HTTPS-päringu teenusele</text>
  <path d="M340,94 L115,128" stroke="#546e7a" stroke-width="2" fill="none" marker-end="url(#t6a)"/>
  <path d="M410,94 L335,128" stroke="#546e7a" stroke-width="2" fill="none" marker-end="url(#t6a)"/>
  <path d="M490,94 L560,128" stroke="#546e7a" stroke-width="2" fill="none" marker-end="url(#t6a)"/>
  <path d="M560,94 L785,128" stroke="#546e7a" stroke-width="2" fill="none" marker-end="url(#t6a)"/>

  <!-- 1 webhook -->
  <rect x="15" y="135" width="205" height="330" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="117" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">Webhook</text>
  <text x="117" y="178" text-anchor="middle" font-size="12" fill="#1565c0">praktikumis kasutad seda</text>
  <text x="30" y="204" font-size="12" font-weight="700" fill="#263238">Kus:</text>
  <text x="30" y="220" font-size="12" fill="#37474f">Discord, Slack, Teams</text>
  <text x="30" y="246" font-size="12" font-weight="700" fill="#263238">Saladus:</text>
  <text x="30" y="262" font-size="12" fill="#37474f">aadress ise, selle lõpus</text>
  <text x="30" y="278" font-size="12" fill="#37474f">on token</text>
  <rect x="25" y="288" width="185" height="40" rx="6" fill="#263238"/>
  <text x="33" y="304" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#eceff1">…/api/webhooks/</text>
  <text x="33" y="320" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#ffcc80">&lt;id&gt;/&lt;token&gt;</text>
  <text x="30" y="350" font-size="12" font-weight="700" fill="#263238">Õigus:</text>
  <text x="30" y="366" font-size="12" fill="#37474f">ainult postitada ühte</text>
  <text x="30" y="382" font-size="12" fill="#37474f">kanalisse</text>
  <text x="30" y="408" font-size="12" font-weight="700" fill="#263238">Alertmanageris:</text>
  <text x="30" y="424" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">discord_configs</text>
  <text x="30" y="440" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">webhook_url_file</text>

  <!-- 2 bot token -->
  <rect x="235" y="135" width="205" height="330" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="337" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">Boti token</text>
  <text x="337" y="178" text-anchor="middle" font-size="12" fill="#546e7a">eraldi botikonto</text>
  <text x="250" y="204" font-size="12" font-weight="700" fill="#263238">Kus:</text>
  <text x="250" y="220" font-size="12" fill="#37474f">Telegram, Slacki rakendus</text>
  <text x="250" y="246" font-size="12" font-weight="700" fill="#263238">Saladus:</text>
  <text x="250" y="262" font-size="12" fill="#37474f">token, lisaks kanali või</text>
  <text x="250" y="278" font-size="12" fill="#37474f">vestluse ID</text>
  <rect x="245" y="288" width="185" height="40" rx="6" fill="#263238"/>
  <text x="253" y="304" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#ffcc80">bot_token: &lt;token&gt;</text>
  <text x="253" y="320" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#eceff1">chat_id: -1001234</text>
  <text x="250" y="350" font-size="12" font-weight="700" fill="#263238">Õigus:</text>
  <text x="250" y="366" font-size="12" fill="#37474f">kõik, mida bot tohib:</text>
  <text x="250" y="382" font-size="12" fill="#37474f">mitu kanalit, ka lugemine</text>
  <text x="250" y="408" font-size="12" font-weight="700" fill="#263238">Alertmanageris:</text>
  <text x="250" y="424" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">telegram_configs</text>
  <text x="250" y="440" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">bot_token_file</text>

  <!-- 3 integration key -->
  <rect x="455" y="135" width="205" height="330" rx="12" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="557" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Integratsioonivõti</text>
  <text x="557" y="178" text-anchor="middle" font-size="12" fill="#00796b">valvesüsteem</text>
  <text x="470" y="204" font-size="12" font-weight="700" fill="#263238">Kus:</text>
  <text x="470" y="220" font-size="12" fill="#37474f">PagerDuty, Opsgenie</text>
  <text x="470" y="246" font-size="12" font-weight="700" fill="#263238">Saladus:</text>
  <text x="470" y="262" font-size="12" fill="#37474f">teenuse võti, mis seob</text>
  <text x="470" y="278" font-size="12" fill="#37474f">alarmi valvegraafikuga</text>
  <rect x="465" y="288" width="185" height="40" rx="6" fill="#263238"/>
  <text x="473" y="312" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#ffcc80">routing_key: &lt;võti&gt;</text>
  <text x="470" y="350" font-size="12" font-weight="700" fill="#263238">Õigus:</text>
  <text x="470" y="366" font-size="12" fill="#37474f">luua intsident; süsteem</text>
  <text x="470" y="382" font-size="12" fill="#37474f">helistab valvajale</text>
  <text x="470" y="408" font-size="12" font-weight="700" fill="#263238">Alertmanageris:</text>
  <text x="470" y="424" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">pagerduty_configs</text>
  <text x="470" y="440" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">routing_key_file</text>

  <!-- 4 email -->
  <rect x="675" y="135" width="210" height="330" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="780" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">E-post</text>
  <text x="780" y="178" text-anchor="middle" font-size="12" fill="#546e7a">SMTP-server</text>
  <text x="690" y="204" font-size="12" font-weight="700" fill="#263238">Kus:</text>
  <text x="690" y="220" font-size="12" fill="#37474f">ettevõtte meiliserver</text>
  <text x="690" y="246" font-size="12" font-weight="700" fill="#263238">Saladus:</text>
  <text x="690" y="262" font-size="12" fill="#37474f">postkasti kasutajanimi</text>
  <text x="690" y="278" font-size="12" fill="#37474f">ja parool</text>
  <rect x="685" y="288" width="190" height="40" rx="6" fill="#263238"/>
  <text x="693" y="304" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#eceff1">auth_username: alarm</text>
  <text x="693" y="320" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#ffcc80">auth_password: …</text>
  <text x="690" y="350" font-size="12" font-weight="700" fill="#263238">Õigus:</text>
  <text x="690" y="366" font-size="12" fill="#37474f">saata meili selle</text>
  <text x="690" y="382" font-size="12" fill="#37474f">postkasti nimel</text>
  <text x="690" y="408" font-size="12" font-weight="700" fill="#263238">Alertmanageris:</text>
  <text x="690" y="424" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">email_configs</text>
  <text x="690" y="440" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">auth_password_file</text>

  <text x="450" y="492" text-anchor="middle" font-size="13" fill="#263238">Kõigil juhtudel on saladus eraldi failis (<tspan font-family="JetBrains Mono, Menlo, monospace">…_file</tspan>) ja repositooriumi see ei lähe.</text>
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#546e7a">Oranž tekst on saladus.</text>
</svg>
