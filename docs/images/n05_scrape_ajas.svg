    <text x="210" y="144" fill="#263238">1,40 GiB</text><text x="370" y="144" fill="#263238">1,38 GiB</text><text x="530" y="144" fill="#90a4ae">puudub</text><text x="690" y="144" fill="#263238">1,35 GiB</text>
    <text x="210" y="180" fill="#00796b" font-weight="700">1</text><text x="370" y="180" fill="#00796b" font-weight="700">1</text><text x="530" y="180" fill="#c62828" font-weight="700">0</text><text x="690" y="180" fill="#00796b" font-weight="700">1</text>
  </g>
  <g stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="3 4"><line x1="210" y1="200" x2="210" y2="330"/><line x1="370" y1="200" x2="370" y2="330"/><line x1="530" y1="200" x2="530" y2="330"/><line x1="690" y1="200" x2="690" y2="330"/></g>
