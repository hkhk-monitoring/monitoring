  <text x="290" y="226" text-anchor="middle" font-size="11" fill="#546e7a">scrape_interval 15 s</text>
  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#546e7a">up=1 tähendab, et kogumine õnnestus, mitte et rakendus töötab kasutaja jaoks. Väärtused on illustratiivsed.</text>
