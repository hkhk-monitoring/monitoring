  <text x="360" y="97" text-anchor="middle" font-size="12" font-weight="700" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">group_by: [alertname]</text>
  <rect x="272" y="110" width="176" height="90" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#546e7a">grupp 1</text>
  <text x="360" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">ProtsessorKoormatud</text>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#263238">2 alarmi</text>
  <rect x="272" y="215" width="176" height="72" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/>
  <text x="360" y="232" text-anchor="middle" font-size="11" fill="#546e7a">grupp 2</text>
  <text x="360" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">KettaruumOtsas</text>
  <text x="360" y="274" text-anchor="middle" font-size="12" fill="#263238">1 alarm</text>

  <line x1="220" y1="107" x2="267" y2="140" stroke="#ff8f00" stroke-width="2" marker-end="url(#a6o)"/>
  <line x1="220" y1="187" x2="267" y2="165" stroke="#ff8f00" stroke-width="2" marker-end="url(#a6o)"/>
  <line x1="220" y1="267" x2="267" y2="252" stroke="#ff8f00" stroke-width="2" marker-end="url(#a6o)"/>

