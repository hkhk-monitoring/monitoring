  <text x="580" y="212" text-anchor="middle" font-size="11" fill="#546e7a">kuhu teade läheb</text>
  <line x1="448" y1="155" x2="495" y2="172" stroke="#546e7a" stroke-width="2" marker-end="url(#a6b)"/>
  <line x1="448" y1="251" x2="495" y2="208" stroke="#546e7a" stroke-width="2" marker-end="url(#a6b)"/>

