  <text x="120" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">KettaruumOtsas</text>
  <text x="120" y="282" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#5d4037">instance=proxmox2</text>

  <!-- group_by -->
