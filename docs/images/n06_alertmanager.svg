<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="a6o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8f00"/></marker>
    <marker id="a6b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/></marker>
    <marker id="a6u" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Alertmanager: grupeeri, suuna, korda</text>

  <!-- alarmid -->
  <text x="20" y="64" font-size="12" font-weight="700" fill="#546e7a">alarmid Prometheusest</text>
  <rect x="20" y="75" width="200" height="64" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="120" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">ProtsessorKoormatud</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#5d4037">instance=proxmox2</text>
  <rect x="20" y="155" width="200" height="64" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
