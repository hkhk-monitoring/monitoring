  <text x="790" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">Discord #it-24</text>
  <rect x="700" y="75" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="790" y="97" text-anchor="middle" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, monospace" fill="#c62828">[FIRING:2]</text>
  <text x="790" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">ProtsessorKoormatud</text>
  <text x="790" y="137" text-anchor="middle" font-size="11" fill="#263238">proxmox2, proxmox3</text>
  <rect x="700" y="205" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="790" y="227" text-anchor="middle" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, monospace" fill="#c62828">[FIRING:1]</text>
  <text x="790" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">KettaruumOtsas</text>
  <text x="790" y="267" text-anchor="middle" font-size="11" fill="#263238">proxmox2</text>
  <text x="790" y="304" text-anchor="middle" font-size="11" fill="#546e7a">üks sõnum grupi kohta</text>
  <line x1="660" y1="172" x2="695" y2="125" stroke="#1565c0" stroke-width="2" marker-end="url(#a6u)"/>
  <line x1="660" y1="200" x2="695" y2="238" stroke="#1565c0" stroke-width="2" marker-end="url(#a6u)"/>

  <!-- ajastus -->
  <text x="20" y="338" font-size="12" font-weight="700" fill="#546e7a">Millal Alertmanager saadab</text>
  <rect x="20" y="350" width="273" height="60" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="156" y="374" text-anchor="middle" font-size="12" font-weight="700" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">group_wait 30s</text>
  <text x="156" y="396" text-anchor="middle" font-size="12" fill="#37474f">esimene teade uue grupi kohta</text>
  <rect x="313" y="350" width="273" height="60" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="449" y="374" text-anchor="middle" font-size="12" font-weight="700" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">group_interval 5m</text>
  <text x="449" y="396" text-anchor="middle" font-size="12" fill="#37474f">grupp muutus, tuleb uus teade</text>
  <rect x="607" y="350" width="273" height="60" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="743" y="374" text-anchor="middle" font-size="12" font-weight="700" font-family="JetBrains Mono, Menlo, monospace" fill="#37474f">repeat_interval 4h</text>
  <text x="743" y="396" text-anchor="middle" font-size="12" fill="#37474f">sama alarm kestab, teade uuesti</text>
</svg>
