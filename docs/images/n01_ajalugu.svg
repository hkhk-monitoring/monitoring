    <circle cx="690" cy="100" r="8" fill="#00796b"/><text x="690" y="75" font-weight="700" fill="#004d40">2011</text><text x="690" y="130" fill="#263238">systemd-journald</text><text x="690" y="147" fill="#546e7a">väljad, kahendvorming</text>
    <circle cx="820" cy="100" r="8" fill="#ff8f00"/><text x="820" y="75" font-weight="700" fill="#e65100">täna</text><text x="820" y="130" fill="#263238">Loki, OpenSearch</text><text x="820" y="147" fill="#546e7a">kohtumised 8-9</text>
