<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="c2o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8f00"/></marker>
    <marker id="c2g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00796b"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">Passiivne ja aktiivne kontroll: kes avab ühenduse</text>
