  <text x="40" y="94" font-size="14" font-weight="700" fill="#e65100">proxmox1</text>
  <rect x="45" y="115" width="250" height="110" rx="10" fill="#ffffff" stroke="#ff8f00" stroke-width="2"/>
  <text x="170" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">Zabbix server</text>
  <text x="170" y="174" text-anchor="middle" font-size="12" fill="#5d4037">template ütleb, mida koguda</text>
  <text x="170" y="198" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#5d4037">võtab vastu port 10051</text>
  <rect x="580" y="60" width="300" height="90" rx="10" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="730" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">proxmox2 · passiivne</text>
  <text x="730" y="112" text-anchor="middle" font-size="13" fill="#263238">agent ootab</text>
  <text x="730" y="134" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">port 10050 lahti</text>
  <rect x="580" y="180" width="300" height="90" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="730" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#004d40">proxmox3 · aktiivne</text>
  <text x="730" y="232" text-anchor="middle" font-size="13" fill="#263238">agent saadab ise</text>
  <text x="730" y="254" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">sissetulevat porti pole vaja</text>
