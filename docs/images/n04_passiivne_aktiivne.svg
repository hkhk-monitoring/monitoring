  <text x="450" y="254" text-anchor="middle" font-size="12" fill="#004d40">agent küsib, mida mõõta, ja saadab</text>
  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#546e7a">Pidev joon: kes avab ühenduse. Kriipsjoon: vastus samas ühenduses.</text>
