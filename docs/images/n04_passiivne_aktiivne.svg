  <text x="440" y="100" text-anchor="middle" font-size="12" fill="#e65100">1. server küsib item'i väärtust</text>
  <line x1="575" y1="122" x2="300" y2="160" stroke="#ff8f00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#c2o)"/>
  <text x="440" y="160" text-anchor="middle" font-size="12" fill="#e65100">2. agent vastab</text>
