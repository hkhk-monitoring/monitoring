    <rect x="20" y="145" width="400" height="44" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/><text x="35" y="166" fill="#263238">node_memory_MemAvailable_bytes</text><text x="35" y="182" fill="#00796b" font-weight="700">{instance="…12:9100"}</text>
    <rect x="480" y="145" width="400" height="44" rx="8" fill="#fafafa" stroke="#b0bec5"/><text x="495" y="172" fill="#263238">{instance="…12:9100"}  1.40e+09</text>
    <rect x="20" y="235" width="400" height="44" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/><text x="35" y="256" fill="#263238">node_memory_MemAvailable_bytes</text><text x="35" y="272" fill="#004d40" font-weight="700">/ node_memory_MemTotal_bytes * 100</text>
