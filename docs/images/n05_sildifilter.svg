  <g stroke="#546e7a" stroke-width="2"><line x1="422" y1="77" x2="476" y2="77" marker-end="url(#g4)"/><line x1="422" y1="167" x2="476" y2="167" marker-end="url(#g4)"/><line x1="422" y1="257" x2="476" y2="257" marker-end="url(#g4)"/></g>
  <g font-size="12" fill="#546e7a">
    <text x="35" y="122">ainult nimi: rida iga target'i kohta</text>
    <text x="35" y="212">sildifilter loogelistes sulgudes: ainult üks masin</text>
    <text x="35" y="302">jagamine: read paaritatakse samade siltide järgi, iga masina kohta üks protsent</text>
  </g>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#546e7a">Aadressid on lühendatud, väärtused on illustratiivsed.</text>
