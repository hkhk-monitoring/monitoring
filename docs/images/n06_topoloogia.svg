  <text x="735" y="132" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">9100/tcp lahti tulemüüris</text>
  <rect x="590" y="185" width="290" height="100" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="735" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">proxmox3</text>
  <text x="735" y="235" text-anchor="middle" font-size="12" fill="#263238">node_exporter (systemd)</text>
  <text x="735" y="257" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#263238">9100/tcp lahti tulemüüris</text>

