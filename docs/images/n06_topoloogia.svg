  <line x1="120" y1="345" x2="120" y2="299" stroke="#1565c0" stroke-width="2" marker-end="url(#p6u)"/>
  <text x="128" y="326" font-size="12" fill="#1565c0">brauser → :3000, :9090, :9093</text>
